<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seashell — centered, fixed 8-in/8-out</title>
<style>
  :root{ --nacre1:#ffe9d6; --nacre2:#ffd3e0; --nacre4:#e6d9ff; --mist:rgba(255,255,255,.55); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; height:100%;
    /* Transparent instead of the old dark gradient — lets the native
       transparent window (see MainActivity.java / styles.xml) show through
       instead of covering it with an opaque "app background" color. The
       mock phone-frame/decoys below are now hidden for the same reason:
       on a real device there is no simulated home screen to draw, only the
       real transparent window background (which renders as black, since a
       separate app cannot read another app's/launcher's screen — that full
       "floats over your real wallpaper" effect needs the native App Widget
       wrapper planned for later). */
    background: transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#eaf3f8;
    touch-action:none;
  }
  #caption{ display:none; }

  #home{
    /* Fixed to the viewport (not flex-centered in body) so the shell can sit
       at one specific screen position, like a real home-screen widget,
       instead of always being placed at the center of whatever content box
       #home happens to be. */
    position:fixed; inset:0; width:100vw; height:100vh;
    background: transparent;
    overflow:visible;
  }
  .decoy{ display:none; }

  /* Shell's resting position on screen — driven by --pos-x/--pos-y custom
     properties (percentages), set from JS. Defaults to centered until a
     calibrated position is loaded from storage (see calibration code).
     --widget-scale scales the ENTIRE widget (shell + ring + beads) together
     as one unit via a single transform on the anchor element, so the
     rotation ring radius and bead sizes stay proportionally correct
     relative to the shell at any calibrated size — never resized/positioned
     independently of each other. */
  #widget{
    position:absolute; left:var(--pos-x, 50%); top:var(--pos-y, 50%); width:1px; height:1px;
    transform: scale(var(--widget-scale, 1));
  }

  /* Calibration mode: shell gets a dashed ring + subtle pulse so it's clear
     it's draggable, and a small hint toast explains what to do. */
  body.calibrating #shell{
    outline: 2px dashed rgba(255,255,255,.85);
    outline-offset: 6px;
    animation: calibratePulse 1.4s ease-in-out infinite;
  }
  @keyframes calibratePulse{
    0%,100%{ box-shadow: 0 12px 26px rgba(0,0,0,.5), inset 0 0 22px rgba(255,255,255,.08), 0 0 0 0 rgba(255,255,255,.35); }
    50%{ box-shadow: 0 12px 26px rgba(0,0,0,.5), inset 0 0 22px rgba(255,255,255,.08), 0 0 0 10px rgba(255,255,255,0); }
  }

  #shell{
    position:absolute; left:0; top:0;
    width:122px; height:122px; margin:-61px;
    border-radius:28px; cursor:pointer;
    transition: transform .5s cubic-bezier(.22,.85,.3,1.15);
    box-shadow: 0 12px 26px rgba(0,0,0,.5), inset 0 0 22px rgba(255,255,255,.08);
    background: radial-gradient(circle at 35% 28%, #fff8f0, var(--nacre1) 30%, var(--nacre2) 58%, var(--nacre4) 85%, #9a86c9 100%);
  }
  #widget.open #shell{ transform: scale(1.05); }
  @keyframes shellSpin{
    from{ transform: rotate(0deg) scale(1); }
    to{ transform: rotate(720deg) scale(1.05); }
  }
  @keyframes shellSpinReverse{
    from{ transform: rotate(0deg) scale(1.05); }
    to{ transform: rotate(-720deg) scale(1); }
  }
  #shell.spinning{ animation: shellSpin .6s cubic-bezier(.3,.1,.2,1) 1; }
  #shell.spinning-close{ animation: shellSpinReverse .6s cubic-bezier(.3,.1,.2,1) 1; }

  /* generous invisible hit area around the origin — beads render inside it via
     transform, but the drag-to-rotate gesture needs somewhere to land even in
     the gaps between beads. Without an explicit size here the container has
     zero area and drags starting off a bead fall through to the background. */
  #chain{
    position:absolute; left:-200px; top:-200px; width:400px; height:400px;
    opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  #widget.open #chain{ opacity:1; pointer-events:auto; }

  .bead{
    position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:500; color:#0c1a22;
    box-shadow: 0 5px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    cursor:pointer;
    overflow:hidden;
  }
  .bead img{
    width:100%; height:100%; object-fit:cover; pointer-events:none;
  }
  .bead.dot{ box-shadow:none; border: 2px solid rgba(255,255,255,.5); }
  .bead.anim{
    transition:
      translate .36s cubic-bezier(.22,.85,.3,1.15) 30ms,
      scale .26s cubic-bezier(.34,1.4,.64,1) 0ms,
      opacity .24s ease 0ms;
  }
  /* Selected-bead "zoom into app" transition: the chosen bead scales up and
     fills more of the view while everything else fades away, giving a sense
     of diving into the app rather than an abrupt jump cut. */
  .bead.launch-selected{
    transition: translate .32s cubic-bezier(.3,.05,.25,1), scale .32s cubic-bezier(.3,.05,.25,1), opacity .32s ease;
    scale: 2.6 !important;
    opacity: 1 !important;
    z-index: 50;
  }
  .bead.launch-fade{
    transition: opacity .22s ease;
    opacity: 0 !important;
  }
  #shell.launch-fade{
    transition: opacity .22s ease;
    opacity: 0;
  }

  #toast{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%) translateY(14px);
    background:rgba(10,25,35,.92); border:1px solid rgba(255,255,255,.12);
    padding:8px 15px; border-radius:999px; font-size:12.5px; opacity:0;
    transition:all .3s cubic-bezier(.2,.9,.3,1.2); white-space:nowrap; z-index:5;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="home">
  <div class="decoy d1"></div><div class="decoy d2"></div>
  <div class="decoy d3"></div><div class="decoy d4"></div>
  <div id="widget">
    <div id="chain"></div>
    <div id="shell"></div>
  </div>
  <div id="toast"></div>
</div>

<script>
// Real installed apps to populate the shell. Labels/colors here are fallbacks
// used until the native AppList plugin returns each app's actual icon (see
// loadRealIcons() below) — once that resolves, icon/label are replaced with
// the real ones read from the device via PackageManager.
const APPS = [
  {n:'Play Store',          pkg:'com.android.vending',                   c:'#4D96FF'},
  {n:'Chrome',               pkg:'com.android.chrome',                    c:'#FFD93D'},
  {n:'Drive',                pkg:'com.google.android.apps.docs',          c:'#6BCB77'},
  {n:'Gmail',                pkg:'com.google.android.gm',                 c:'#FF6B6B'},
  {n:'Lens',                 pkg:'com.google.ar.lens',                    c:'#9D65C9'},
  {n:'Maps',                 pkg:'com.google.android.apps.maps',          c:'#2EC4B6'},
  {n:'YouTube',              pkg:'com.google.android.youtube',            c:'#E71D36'},
  {n:'Photos',               pkg:'com.google.android.apps.photos',        c:'#FDB833'},
  {n:'Calendar',             pkg:'com.google.android.calendar',           c:'#3A86FF'},
  {n:'LinkedIn',             pkg:'com.linkedin.android',                  c:'#0A66C2'},
  {n:'IRCTC RailConnect',    pkg:'cris.org.in.prs.ima',                   c:'#FF9F1C'},
  {n:'Where is my train',    pkg:'com.whereismytrain.android',            c:'#06D6A0'},
  {n:'RailOne',              pkg:'org.cris.aikyam',                      c:'#F72585'},
  {n:'Google',               pkg:'com.google.android.googlequicksearchbox', c:'#8338EC'},
  {n:'Lock',                 pkg:'com.android.bbk.lockscreen3',           c:'#FB5607'}
];
const N = APPS.length;
const EXPANDED_COUNT = 8;
const WINDOW_CENTER = 180;          // fixed absolute direction beads reveal toward

// single ring around the shell — evenly spaced, radius sized so even two
// full-size (40px) neighbors keep at least ~12px clearance between them
const RING_RADIUS = 104;
const LOCAL = [];
for (let i=0;i<N;i++){
  LOCAL.push({ angle: i * (360/N), radius: RING_RADIUS });
}
// descending sizes for rank 0 (closest to window center) .. rank 7 (8th, smallest expanded)
const RANK_SIZE = [1, 0.93, 0.86, 0.79, 0.72, 0.65, 0.58, 0.5];
const DOT_SIZE = 0.26;

function norm180(a){ return ((a+180)%360+360)%360 - 180; }

let rotationAngle = 0;
let isOpen = false;
let isAnimating = false; // true for the full duration of an open or close transition

const widget = document.getElementById('widget');
const chain = document.getElementById('chain');
const shell = document.getElementById('shell');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.remove('show'), 1400);
}

function buildBeads(){
  chain.innerHTML = '';
  APPS.forEach((app,i)=>{
    const el = document.createElement('div');
    el.className = 'bead';
    el.dataset.i = i;
    el.style.background = app.c;
    // start collapsed into the shell — the open animation grows/spreads these out
    el.style.translate = '0px 0px';
    el.style.scale = '0';
    el.style.opacity = '0';
    chain.appendChild(el);
  });
}

/**
 * Fetches every installed app's real icon/label via the native AppList
 * plugin, then updates APPS in place (matched by package name) and
 * re-renders the beads so the shell shows real icons instead of the
 * fallback colored-letter placeholders. Safe to call once at startup;
 * silently leaves fallbacks in place if the plugin isn't available
 * (e.g. running in a plain browser instead of the native app).
 */
async function loadRealIcons(){
  if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AppList) {
    return; // not running inside the native app — keep fallback placeholders
  }
  try {
    const { apps: installed } = await window.Capacitor.Plugins.AppList.listApps();
    const byPackage = {};
    installed.forEach(a => { byPackage[a.packageName] = a; });

    for (const app of APPS) {
      const match = byPackage[app.pkg];
      if (match) {
        app.icon = match.icon;
        app.n = match.label || app.n;
        app.dotColor = await extractDominantColor(match.icon).catch(() => app.c);
      }
    }

    renderBeadContents();
  } catch (err) {
    // Leave fallback placeholders in place if anything goes wrong.
    console.warn('loadRealIcons failed:', err);
  }
}

/**
 * Samples a real app icon down to a single pixel to get its dominant/
 * average color — used to tint the shrunk "dot" state with a real color
 * from the app instead of leaving it plain/transparent.
 */
function extractDominantColor(iconDataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = 1; c.height = 1;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 1, 1);
        const [r,g,b] = ctx.getImageData(0,0,1,1).data;
        resolve(`rgb(${r},${g},${b})`);
      } catch (err) {
        reject(err);
      }
    };
    img.onerror = reject;
    img.src = iconDataUrl;
  });
}

/** Fills each bead's inner content (icon image or fallback letter). */
function renderBeadContents(){
  const beads = chain.children;
  for (let idx=0; idx<beads.length; idx++){
    const el = beads[idx];
    const i = +el.dataset.i;
    const app = APPS[i];
    if (app.icon) {
      el.innerHTML = `<img src="${app.icon}" alt="${app.n}">`;
    } else {
      el.textContent = app.n[0];
    }
  }
}

function layout(){
  // 1) compute every bead's current absolute angle under this rotation
  const angles = LOCAL.map((l,i) => ({ i, angle: l.angle + rotationAngle }));
  // 2) rank by distance to the fixed reveal direction — nearest 8 are expanded
  const ranked = angles.slice().sort((a,b) =>
    Math.abs(norm180(a.angle - WINDOW_CENTER)) - Math.abs(norm180(b.angle - WINDOW_CENTER))
  );
  const sizeByIndex = {};
  ranked.forEach((r, rank) => {
    sizeByIndex[r.i] = rank < EXPANDED_COUNT ? RANK_SIZE[rank] : DOT_SIZE;
  });

  const beads = chain.children;
  for (let idx=0; idx<beads.length; idx++){
    const el = beads[idx];
    const i = +el.dataset.i;
    const local = LOCAL[i];
    const angle = local.angle + rotationAngle;
    const rad = angle * Math.PI/180;
    const x = Math.cos(rad) * local.radius;
    const y = -Math.sin(rad) * local.radius;
    const scale = sizeByIndex[i];
    const isDot = scale <= DOT_SIZE + 0.001;

    el.style.translate = `${x}px ${y}px`;
    el.style.scale = String(scale);
    el.style.opacity = '1';
    el.style.zIndex = Math.round(scale*100);

    el.classList.toggle('dot', isDot);
    const app = APPS[i];
    if (isDot) {
      // Dots are always colored (real dominant icon color once loaded,
      // fallback color until then) — never transparent — so the collapsed
      // ring still reads as "colored beads", not blank/invisible dots.
      el.style.background = app.dotColor || app.c;
      el.innerHTML = '';
    } else if (app.icon) {
      el.style.background = 'transparent';
      // Icon already rendered by renderBeadContents(); layout() only needs
      // to size/position the bead, not touch its icon content.
      if (!el.querySelector('img')) el.innerHTML = `<img src="${app.icon}" alt="${app.n}">`;
    } else {
      el.style.background = app.c;
      el.textContent = app.n[0];
    }
  }
}

let openTimer1=null, openTimer2=null, closeTimer=null;
const STEP_MS = 30;                       // gap between one app launching and the next
const STAGGER_MAX = (N-1) * STEP_MS;      // longest per-bead transition-delay
const EMERGE_MS = STAGGER_MAX + 370;      // enough time for the slowest bead to finish (30ms delay + 300ms travel + buffer)
const SHELL_SPIN_MS = EMERGE_MS + 110;    // shell spin runs a bit longer than the apps, so they finish first

function clearAllTimers(){
  clearTimeout(openTimer1); clearTimeout(openTimer2); clearTimeout(closeTimer);
}

function openWidget(){
  if (isOpen || isAnimating) return;
  clearAllTimers();
  isOpen = true;
  isAnimating = true;
  widget.classList.add('open');

  shell.classList.remove('spinning-close');
  shell.style.animationDuration = `${SHELL_SPIN_MS}ms`;
  shell.classList.add('spinning');
  openTimer1 = setTimeout(()=>{
    shell.classList.remove('spinning');
    isAnimating = false;
  }, SHELL_SPIN_MS + 20);

  const beads = [...chain.children];
  beads.forEach(el => {
    const i = +el.dataset.i;
    el.style.transition = '';
    el.style.transitionDelay = `${i * STEP_MS}ms`;   // clockwise sweep: 0,1,2...N-1
    el.classList.add('anim');
  });
  layout(); // beads transition from the collapsed center out to the ring, one after another
  openTimer2 = setTimeout(()=>{
    beads.forEach(el => el.classList.remove('anim'));
  }, EMERGE_MS);
}

function closeWidget(exitAfter){
  if (!isOpen || isAnimating) return;
  clearAllTimers();
  stopInertia();
  isOpen = false;
  isAnimating = true;

  shell.classList.remove('spinning');
  shell.style.animationDuration = `${SHELL_SPIN_MS}ms`;
  shell.classList.add('spinning-close');

  const beads = [...chain.children];
  beads.forEach(el => {
    const i = +el.dataset.i;
    el.style.transition = '';
    el.style.transitionDelay = `${(N - 1 - i) * STEP_MS}ms`;   // anticlockwise sweep: N-1,...,1,0
    el.classList.add('anim');
    el.style.translate = '0px 0px';
    el.style.scale = '0';
    el.style.opacity = '0';
  });
  closeTimer = setTimeout(()=>{
    widget.classList.remove('open');
    shell.classList.remove('spinning-close');
    beads.forEach(el => { el.classList.remove('anim'); el.style.opacity = ''; });
    isAnimating = false;
    // If the shell was closed without picking an app (tapped the shell
    // itself, or tapped outside it), send the app to the background —
    // like pressing Home — once the collapse animation finishes, instead
    // of leaving the user sitting on our closed-but-still-foregrounded
    // shell screen.
    if (exitAfter) exitToHome();
  }, SHELL_SPIN_MS + 20);
}

/**
 * Resets the shell straight to its closed, collapsed-at-rest visual state
 * with no animation — used when the app resumes (home button / recents /
 * cold start) so it never starts up visibly "open" from a previous session.
 */
function resetToClosedInstant(){
  clearAllTimers();
  stopInertia();
  isOpen = false;
  isAnimating = false;
  widget.classList.remove('open');
  shell.classList.remove('spinning', 'spinning-close');
  const beads = [...chain.children];
  beads.forEach(el => {
    el.classList.remove('anim');
    el.style.transition = 'none';
    el.style.translate = '0px 0px';
    el.style.scale = '0';
    el.style.opacity = '0';
  });
  // force layout flush so the next openWidget() call picks up fresh styles
  void chain.offsetHeight;
  beads.forEach(el => { el.style.transition = ''; });
}

/** Sends the app to background (like pressing Home) via the native plugin. */
async function exitToHome(){
  if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AppList) return;
  try {
    await window.Capacitor.Plugins.AppList.exitToHome();
  } catch (err) {
    console.warn('exitToHome failed:', err);
  }
}

shell.addEventListener('pointerdown', (e)=> e.stopPropagation());
shell.addEventListener('click', (e)=>{
  e.stopPropagation();
  if (isCalibrating) return; // taps don't open/close while repositioning
  if (isAnimating) return; // ignore taps entirely while opening or closing
  isOpen ? closeWidget(true) : openWidget();
});

document.addEventListener('pointerdown', (e)=>{
  if (isOpen && !isAnimating && !e.target.closest('#widget')) closeWidget(true);
});

// ---------------------------------------------------------------------------
// Shell position + size calibration — lets the user drag the shell to
// exactly match wherever they've placed the app's real icon on their home
// screen, and pinch it to the same size as that real icon, so it feels like
// a genuine home-screen widget rather than an arbitrary fixed spot/size.
// Position is stored as percentages and scale as a plain multiplier (not raw
// pixels) so both stay correct across different screen sizes/orientations.
// Scaling is applied once to the #widget anchor itself (see CSS), so the
// rotation ring radius and every bead automatically stay in the same
// proportion to the shell at any calibrated size — nothing about the
// rotation circle needs separate adjustment.
// Entered via a long-press on the shell while closed:
//   - 1 finger dragging  -> moves the widget
//   - 2 fingers pinching -> resizes the widget (shell + ring + beads together)
// ---------------------------------------------------------------------------
const POS_STORAGE_KEY = 'seashell_widget_pos';
const MIN_SCALE = 0.5, MAX_SCALE = 2.2;
let isCalibrating = false;
let currentScale = 1;
const calibPointers = new Map(); // pointerId -> {x,y}
let pinchStartDist = null, pinchStartScale = 1;

function loadSavedPosition(){
  try {
    const raw = localStorage.getItem(POS_STORAGE_KEY);
    if (!raw) return;
    const { xPct, yPct, scale } = JSON.parse(raw);
    if (typeof xPct === 'number' && typeof yPct === 'number') {
      widget.style.setProperty('--pos-x', `${xPct}%`);
      widget.style.setProperty('--pos-y', `${yPct}%`);
    }
    if (typeof scale === 'number') {
      currentScale = scale;
      widget.style.setProperty('--widget-scale', String(scale));
    }
  } catch (err) {
    console.warn('loadSavedPosition failed:', err);
  }
}

function savePosition(xPct, yPct, scale){
  try {
    localStorage.setItem(POS_STORAGE_KEY, JSON.stringify({ xPct, yPct, scale }));
  } catch (err) {
    console.warn('savePosition failed:', err);
  }
}

function enterCalibrationMode(){
  if (isOpen || isAnimating) return;
  isCalibrating = true;
  document.body.classList.add('calibrating');
  showToast('Drag to reposition · pinch with 2 fingers to resize · lift to confirm');
}

function exitCalibrationMode(){
  isCalibrating = false;
  document.body.classList.remove('calibrating');
  calibPointers.clear();
  pinchStartDist = null;
}

function currentWidgetPercent(){
  const style = getComputedStyle(widget);
  return {
    xPct: parseFloat(style.getPropertyValue('--pos-x')) || 50,
    yPct: parseFloat(style.getPropertyValue('--pos-y')) || 50,
  };
}

function pointerDistance(){
  const pts = [...calibPointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

let longPressTimer = null;
shell.addEventListener('pointerdown', (e)=>{
  if (!isCalibrating) {
    longPressTimer = setTimeout(()=> enterCalibrationMode(), 600);
    return;
  }
  e.stopPropagation();
  shell.setPointerCapture(e.pointerId);
  calibPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (calibPointers.size === 2) {
    pinchStartDist = pointerDistance();
    pinchStartScale = currentScale;
  }
});
shell.addEventListener('pointermove', (e)=>{
  if (!isCalibrating || !calibPointers.has(e.pointerId)) return;
  calibPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (calibPointers.size >= 2) {
    // Two (or more) fingers down: resize, position stays as-is.
    const dist = pointerDistance();
    if (pinchStartDist) {
      currentScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * (dist / pinchStartDist)));
      widget.style.setProperty('--widget-scale', String(currentScale));
    }
  } else {
    // Single finger: move.
    const xPct = (e.clientX / window.innerWidth) * 100;
    const yPct = (e.clientY / window.innerHeight) * 100;
    widget.style.setProperty('--pos-x', `${xPct}%`);
    widget.style.setProperty('--pos-y', `${yPct}%`);
  }
});
function endCalibPointer(e){
  if (!isCalibrating || !calibPointers.has(e.pointerId)) return;
  e.stopPropagation();
  try{ shell.releasePointerCapture(e.pointerId); }catch(err){}
  calibPointers.delete(e.pointerId);

  if (calibPointers.size < 2) pinchStartDist = null; // pinch ended if it was happening

  if (calibPointers.size === 0) {
    const { xPct, yPct } = currentWidgetPercent();
    savePosition(xPct, yPct, currentScale);
    exitCalibrationMode();
    showToast('Position & size saved');
  }
}
shell.addEventListener('pointerup', (e)=>{ clearTimeout(longPressTimer); endCalibPointer(e); });
shell.addEventListener('pointercancel', (e)=>{ clearTimeout(longPressTimer); endCalibPointer(e); });

loadSavedPosition();

// circular drag — clamped to a small rotation range
let rotDrag = null, rafPending = false, lastMoveEvent = null;
const DRAG_SENSITIVITY = 1.8;
chain.addEventListener('pointerdown', (e)=>{
  e.stopPropagation();
  if (!isOpen) return;
  // starting a drag always wins — kill any pending open/close transition,
  // via both the class AND an inline override, so this is unambiguously instant.
  clearAllTimers();
  isAnimating = false;
  shell.classList.remove('spinning','spinning-close');
  [...chain.children].forEach(el => { el.classList.remove('anim'); el.style.transition = 'none'; });

  const rect = shell.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  rotDrag = { cx, cy, lastAngle: Math.atan2(-(e.clientY-cy), e.clientX-cx)*180/Math.PI,
              downX:e.clientX, downY:e.clientY, target:e.target.closest('.bead'), pointerId:e.pointerId,
              lastTime: performance.now(), velocity: 0 };
  chain.setPointerCapture(e.pointerId);
  stopInertia(); // a new drag always takes over from any ongoing coast
});
chain.addEventListener('pointermove', (e)=>{
  if (!rotDrag) return;
  lastMoveEvent = e;
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    if (!rotDrag || !lastMoveEvent) return;
    const ev = lastMoveEvent;
    const a = Math.atan2(-(ev.clientY-rotDrag.cy), ev.clientX-rotDrag.cx)*180/Math.PI;
    let delta = a - rotDrag.lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    rotDrag.lastAngle = a;
    rotDrag.moved = rotDrag.moved || Math.hypot(ev.clientX-rotDrag.downX, ev.clientY-rotDrag.downY) > 6;
    if (!rotDrag.moved) return;

    const now = performance.now();
    const dt = Math.max(1, now - rotDrag.lastTime);
    rotDrag.velocity = (delta * DRAG_SENSITIVITY) / dt; // degrees per ms, most recent motion
    rotDrag.lastTime = now;

    rotationAngle += delta * DRAG_SENSITIVITY;
    layout();
  });
});
let inertiaRAF = null;
function stopInertia(){
  if (inertiaRAF) cancelAnimationFrame(inertiaRAF);
  inertiaRAF = null;
}
function startInertia(velocity){
  const FRICTION = 0.88;      // per-frame decay — lower = stops sooner
  const MIN_VELOCITY = 0.006; // degrees/ms below which we just stop
  let v = velocity;
  let lastT = performance.now();
  function step(now){
    const dt = Math.min(48, now - lastT); // clamp in case of a dropped frame
    lastT = now;
    if (!isOpen || Math.abs(v) < MIN_VELOCITY) { inertiaRAF = null; return; }
    rotationAngle += v * dt;
    layout();
    v *= Math.pow(FRICTION, dt / 16); // frame-rate independent decay
    inertiaRAF = requestAnimationFrame(step);
  }
  inertiaRAF = requestAnimationFrame(step);
}

function endRotDrag(e){
  if (!rotDrag) return;
  e && e.stopPropagation();
  const wasTap = !rotDrag.moved;
  const tapTarget = rotDrag.target;
  const pid = rotDrag.pointerId;
  const velocity = rotDrag.velocity || 0;
  rotDrag = null;
  try{ chain.releasePointerCapture(pid); }catch(err){}
  if (wasTap && tapTarget){
    const scaleNow = parseFloat(tapTarget.style.scale || 0);
    if (scaleNow > DOT_SIZE + 0.05){
      const app = APPS[+tapTarget.dataset.i];
      launchRealApp(app, tapTarget);
    }
  } else if (Math.abs(velocity) > 0.01){
    startInertia(velocity);
  }
}
chain.addEventListener('pointerup', endRotDrag);
chain.addEventListener('pointercancel', endRotDrag);

/**
 * Plays a quick "zoom into this app" transition — the selected bead grows
 * and everything else (other beads + shell) fades out — before actually
 * firing the launch intent, so switching apps feels like a smooth dive in
 * rather than an abrupt jump cut. Also snaps the widget closed in the
 * background with no animation, so there's nothing left open to see when
 * the user eventually returns to Seashell.
 */
async function launchRealApp(app, selectedEl){
  const ZOOM_MS = 300;
  isAnimating = true;
  clearAllTimers();
  stopInertia();

  const beads = [...chain.children];
  beads.forEach(el => {
    el.style.transitionDelay = '0ms';
    if (el === selectedEl) {
      el.classList.add('launch-selected');
    } else {
      el.classList.add('launch-fade');
    }
  });
  shell.classList.add('launch-fade');

  if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AppList) {
    showToast(`Opening ${app.n} (no native bridge — browser preview)`);
  } else {
    try {
      await window.Capacitor.Plugins.AppList.launchApp({ packageName: app.pkg });
    } catch (err) {
      showToast(`Could not open ${app.n}`);
      console.warn('launchApp failed:', err);
    }
  }

  setTimeout(() => {
    beads.forEach(el => el.classList.remove('launch-selected', 'launch-fade'));
    shell.classList.remove('launch-fade');
    resetToClosedInstant();
  }, ZOOM_MS);
}

buildBeads();
loadRealIcons();

// Always resume in the closed state, never visibly "open" from a previous
// session — covers both pressing Home and returning via Recents, since
// Android keeps this Activity (and its WebView/JS state) alive in the
// background rather than destroying it, so without this the shell would
// otherwise still be showing however it was left.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    resetToClosedInstant();
  }
});
</script>
</body>
